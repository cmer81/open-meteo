# Infoclimat pipeline — Phase 1 smoke test
# Runs the Open-Meteo download/convert pipeline locally for AROME France HD.
#
# Usage:
#   cp .env.example .env   # then edit METEOFRANCE_API_KEY
#   docker compose up      # one-shot download of latest run, then exits
#
# Output appears in ./data/data_spatial/meteofrance_arome_france_hd/<run>/*.om

services:
  arome-france-hd:
    image: ghcr.io/open-meteo/open-meteo:latest
    container_name: ic-arome-france-hd
    env_file: .env
    environment:
      LOG_LEVEL: info
      DATA_DIRECTORY: /app/data/
      DATA_SPATIAL_DIRECTORY: /app/data/data_spatial/
    volumes:
      - ./data:/app/data
    # Smoke test: 2 variables, 6-hour forecast horizon, 2 concurrent downloads.
    # Drop --only-variables and --max-forecast-hour for full production sync.
    command:
      - download-meteofrance
      - arome_france_hd
      - --run
      - "2026051615"
      - --only-variables
      - precipitation,temperature_2m
      - --max-forecast-hour
      - "6"
      - --concurrent
      - "2"
